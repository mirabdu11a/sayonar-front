name: Deploy frontend to sayonar.uz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SAYONAR_HOST }}
          username: ${{ secrets.SAYONAR_USER }}
          key: ${{ secrets.SAYONAR_DEPLOY_KEY }}
          port: 22
          # Server's authorized_keys forces /usr/local/bin/sayonar-deploy
          # which pulls BOTH backend + frontend, rebuilds, restarts.
          script: deploy
